<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ดอกมะลิสำหรับแม่ 🤍</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="page-two">

    <div class="background-glow"></div>


    <!-- กลีบดอกตก -->
    <div class="floating-petal petal-1"></div>
    <div class="floating-petal petal-2"></div>
    <div class="floating-petal petal-3"></div>
    <div class="floating-petal petal-4"></div>
    <div class="floating-petal petal-5"></div>


    <main class="memory-scene">


        <!-- รูปความทรงจำ -->

        <div class="memory-photo photo-1">
            <img src="mom1.png.jpg"
                 alt="รูปของแม่">
        </div>


        <div class="memory-photo photo-2">
            <img src="me1.png.jpg"
                 alt="รูปของเรา">
        </div>


        <div class="memory-photo photo-3">
            <img src="mom2.png.jpg"
                 alt="รูปของแม่">
        </div>


        <div class="memory-photo photo-4">
            <img src="me2.png.jpg"
                 alt="รูปของเรา">
        </div>


        <div class="memory-photo photo-5">
            <img src="memory1.png.jpg"
                 alt="ความทรงจำ">
        </div>


        <!-- ดอกมะลิ -->

        <div class="flower-container">

            <svg
                class="jasmine-svg"
                viewBox="0 0 800 800"
                xmlns="http://www.w3.org/2000/svg">


                <defs>

                    <radialGradient
                        id="petalGradient">

                        <stop
                            offset="0%"
                            stop-color="#ffffff"/>

                        <stop
                            offset="55%"
                            stop-color="#faf8f3"/>

                        <stop
                            offset="82%"
                            stop-color="#e9e5dc"/>

                        <stop
                            offset="100%"
                            stop-color="#d8d2c8"/>

                    </radialGradient>


                    <radialGradient
                        id="innerPetalGradient">

                        <stop
                            offset="0%"
                            stop-color="#ffffff"/>

                        <stop
                            offset="65%"
                            stop-color="#f7f4ed"/>

                        <stop
                            offset="100%"
                            stop-color="#ddd8cf"/>

                    </radialGradient>


                    <linearGradient
                        id="leafGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

                        <stop
                            offset="0%"
                            stop-color="#78936d"/>

                        <stop
                            offset="45%"
                            stop-color="#557752"/>

                        <stop
                            offset="100%"
                            stop-color="#304f36"/>

                    </linearGradient>


                    <linearGradient
                        id="stemGradient">

                        <stop
                            offset="0%"
                            stop-color="#2d5135"/>

                        <stop
                            offset="50%"
                            stop-color="#64805b"/>

                        <stop
                            offset="100%"
                            stop-color="#304d35"/>

                    </linearGradient>


                    <radialGradient
                        id="glow">

                        <stop
                            offset="0%"
                            stop-color="#ffffff"
                            stop-opacity=".9"/>

                        <stop
                            offset="100%"
                            stop-color="#ffffff"
                            stop-opacity="0"/>

                    </radialGradient>

                </defs>


                <!-- กิ่ง -->

                <path
                    class="stem"
                    d="
                    M400 730
                    C395 650 405 570 400 490
                    C397 430 390 385 400 330
                    "/>


                <path
                    class="branch"
                    d="
                    M400 540
                    C350 500 310 470 275 430
                    "/>


                <path
                    class="branch"
                    d="
                    M402 590
                    C450 550 495 510 530 470
                    "/>


                <!-- ใบ -->

                <path
                    class="leaf"
                    d="
                    M340 500
                    C285 515 245 480 250 425
                    C300 430 335 455 340 500
                    Z
                    "/>


                <path
                    class="leaf"
                    d="
                    M460 550
                    C515 555 555 520 555 470
                    C510 468 475 495 460 550
                    Z
                    "/>


                <path
                    class="leaf"
                    d="
                    M390 650
                    C330 660 300 625 310 575
                    C350 580 380 610 390 650
                    Z
                    "/>


                <!-- แสง -->

                <circle
                    cx="400"
                    cy="330"
                    r="190"
                    fill="url(#glow)"/>


                <!-- ดอก -->

                <g
                    class="flower-group">


                    <!-- กลีบนอก -->

                    <g class="petals">


                        <path
                            class="petal"
                            d="
                            M400 330
                            C370 285 360 215 390 175
                            C410 148 435 178 438 215
                            C442 260 425 300 400 330
                            Z"/>


                        <path
                            class="petal"
                            d="
                            M400 330
                            C430 285 480 240 525 245
                            C552 249 550 285 525 310
                            C490 345 445 350 400 330
                            Z"/>


                        <path
                            class="petal"
                            d="
                            M400 330
                            C455 330 515 350 530 390
                            C540 420 505 435 475 420
                            C430 400 405 365 400 330
                            Z"/>


                        <path
                            class="petal"
                            d="
                            M400 330
                            C430 380 450 440 425 475
                            C405 502 375 478 370 445
                            C365 400 380 355 400 330
                            Z"/>


                        <path
                            class="petal"
                            d="
                            M400 330
                            C370 380 325 430 280 425
                            C250 420 250 385 275 360
                            C310 330 355 320 400 330
                            Z"/>


                        <path
                            class="petal"
                            d="
                            M400 330
                            C350 325 295 300 285 260
                            C278 230 310 215 340 235
                            C380 260 400 295 400 330
                            Z"/>

                    </g>


                    <!-- กลีบใน -->

                    <g class="inner-petals">

                        <path
                            class="inner-petal"
                            d="
                            M400 330
                            C375 300 370 260 395 240
                            C415 225 435 255 430 285
                            C425 310 415 325 400 330
                            Z"/>


                        <path
                            class="inner-petal"
                            d="
                            M400 330
                            C430 300 465 295 485 315
                            C500 330 480 350 455 355
                            C430 360 410 350 400 330
                            Z"/>


                        <path
                            class="inner-petal"
                            d="
                            M400 330
                            C430 345 445 375 435 395
                            C425 415 395 400 390 375
                            C385 355 390 340 400 330
                            Z"/>


                        <path
                            class="inner-petal"
                            d="
                            M400 330
                            C375 350 350 365 330 350
                            C312 335 330 310 355 305
                            C375 302 392 315 400 330
                            Z"/>

                    </g>


                    <!-- เกสร -->

                    <g
                        class="flower-center"
                        onclick="goToLove()">

                        <circle
                            cx="400"
                            cy="330"
                            r="30"
                            fill="rgba(240,215,120,.12)"/>


                        <circle
                            cx="400"
                            cy="330"
                            r="17"
                            fill="#f3df86"/>


                        <circle
                            cx="395"
                            cy="325"
                            r="7"
                            fill="#fff4b4"/>


                        <circle
                            class="stamen"
                            cx="390"
                            cy="319"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="397"
                            cy="315"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="405"
                            cy="315"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="412"
                            cy="320"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="413"
                            cy="330"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="406"
                            cy="338"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="396"
                            cy="340"
                            r="3"/>

                        <circle
                            class="stamen"
                            cx="388"
                            cy="334"
                            r="3"/>

                    </g>

                </g>

            </svg>

        </div>


        <div class="memory-title">

            <span>ความทรงจำเล็ก ๆ 🤍</span>

        </div>

    </main>


    <!-- เพลง -->

    <audio id="backgroundMusic"
           src="music.mp3"
           loop>
    </audio>


    <button
        class="music-button"
        onclick="toggleMusic()">

        🔊

    </button>


    <script src="script.js"></script>

    <script>

        window.addEventListener(
            "load",
            () => {

                startMusic();

            }
        );


        function goToLove() {

            createSparkles();

            saveMusicTime();

            setTimeout(
                () => {

                    window.location.href =
                        "love.html";

                },
                500
            );

        }

    </script>

</body>
</html>
